name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # محاكي Firestore يحتاج Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: توليد الأيقونات (مطلوبة للبناء)
        run: npm run icons

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: اختبارات قواعد Firestore على المحاكي
        run: npm run test:rules

      - run: npm run build
        env:
          BASE_PATH: ./
